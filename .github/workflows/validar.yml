name: Validar TechPaper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-e-banco:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: techpaper_integration
          POSTGRES_USER: techpaper_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U techpaper_test -d techpaper_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restaurar dependências
        run: dotnet restore api/TechPaperAPI.csproj
      - name: Compilar API
        run: dotnet build api/TechPaperAPI.csproj --configuration Release --no-restore
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verificar JavaScript e isolamento de sessão web
        run: |
          node --check api/wwwroot/app.js
          node --test tests/web_session.test.mjs
      - name: Conferir artefatos obrigatórios do banco
        shell: bash
        run: |
          grep -q 'CREATE OR REPLACE PROCEDURE' database/002_routines.sql
          grep -q 'TRG_ATUALIZA_ESTOQUE' database/002_routines.sql
          grep -q 'relatos_inclusao' database/001_schema.sql

      - name: Iniciar API com banco descartável
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=techpaper_integration;Username=techpaper_test;Password=disposable-ci-password
          DatabaseInit__Enabled: 'true'
          Bootstrap__Enabled: 'true'
          Bootstrap__Login: admin-ci@example.com
          Bootstrap__Password: Disposable-Integration-2026!
          ASPNETCORE_URLS: http://127.0.0.1:5184
        run: |
          dotnet api/bin/Release/net10.0/TechPaperAPI.dll > "$RUNNER_TEMP/techpaper-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/techpaper-api.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5184/health/ready; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/techpaper-api.log"
          exit 1
      - name: Executar integração real da API com PostgreSQL
        env:
          TP_TEST_ALLOW_MUTATIONS: '1'
          TP_TEST_URL: http://127.0.0.1:5184
          TP_TEST_LOGIN: admin-ci@example.com
          TP_TEST_PASSWORD: Disposable-Integration-2026!
        run: python3 -m unittest discover -s tests -p '*test.py' -v
      - name: Verificar gatilhos e consistência do PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: techpaper_integration
          PGUSER: techpaper_test
          PGPASSWORD: disposable-ci-password
        run: psql -v ON_ERROR_STOP=1 -f tests/database_checks.sql
      - name: Mostrar logs da API em caso de falha
        if: failure()
        run: cat "$RUNNER_TEMP/techpaper-api.log" 2>/dev/null || true
      - name: Encerrar API de testes
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/techpaper-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/techpaper-api.pid")" 2>/dev/null || true
          fi

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Testar comunicação mobile
        run: pnpm test
      - name: Validar configuração do Expo
        run: pnpm exec expo install --check
      - name: Exportar pacote Android
        run: pnpm exec expo export --platform android --no-bytecode --max-workers 1
